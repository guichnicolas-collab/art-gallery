<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Gallery</title>
  </head>
  <body>
    <div id="image-container"></div>
    <script>
      async function search(term) {
        const searchUrl = `https://collectionapi.metmuseum.org/public/collection/v1.1/search?q=${term}`;
        try {
          const response = await fetch(searchUrl);
          if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
          }
          const result = await response.json();
          return result;
        } catch (error) {
          console.error(error.message);
        }
      }

      async function getData() {
        const result = await search("flower");
        const url = `https://collectionapi.metmuseum.org/public/collection/v1/objects/${result.objectIDs[6]}`;
        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
          }
          const result = await response.json();
          const container = document.getElementById("image-container");
          container.innerHTML = `<img src="${result.primaryImageSmall}"></img>`;
        } catch (error) {
          console.error(error.message);
        }
      }
      getData();
    </script>
  </body>
</html>
